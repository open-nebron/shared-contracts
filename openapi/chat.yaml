openapi: 3.1.0
info:
  title: Nebron Chat Service
  description: Real-time chat and messaging microservice for Nebron
  version: 1.0.0
servers:
  - url: /
    description: Current environment

paths:
  /health:
    get:
      tags:
        - Health
      summary: Service health and readiness check
      description: Returns health status of ScyllaDB, Redis, and JWKS cache.
      responses:
        '200':
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more dependencies are down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ws:
    get:
      tags:
        - Real-Time WebSocket
      summary: Real-Time WebSocket Gateway
      description: |
        Upgrades HTTP connection to WebSocket for bidirectional real-time messaging, typing indicators, and presence tracking.
        Requires query parameter `token=<access_token>` containing a valid RS256 Bearer JWT.

        Close Codes:
        - 4401: Invalid or expired token
        - 4403: Session revoked
        - 4408: Maximum concurrent connections exceeded (max 5)
        - 4409: Frame too large (limit: 32 KB)

        Refer to `route-docs/ws-protocol.md` and `route-docs/ws-errors.md` for full message frame schemas.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: RS256 JWT access token
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          description: Missing or invalid token (connection closed with 4401)
        '403':
          description: Revoked session (connection closed with 4403)

  /conversations:
    post:
      tags:
        - Conversations
      summary: Start or get a 1:1 direct conversation
      description: Computes a deterministic conversation ID for the peer user pair and seeds conversation records idempotently.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        '200':
          description: Conversation created or retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          description: Invalid payload, invalid UUID, or attempting to chat with self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    get:
      tags:
        - Conversations
      summary: List conversations for authenticated user
      description: Returns conversations ordered descending by last message timestamp with pagination cursor.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
          description: Maximum number of conversations to return
        - in: query
          name: before
          schema:
            type: string
            format: date-time
          description: ISO timestamp cursor to fetch conversations prior to
        - in: query
          name: kind
          schema:
            type: string
            enum: [direct, group, all]
            default: all
          description: Filter conversations by kind (direct, group, or all)
      responses:
        '200':
          description: List of user conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (300/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/group:
    post:
      tags:
        - Groups
      summary: Create a group conversation
      description: Creates a new group conversation with the authenticated user as the owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group conversation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupConversationResponse'
        '400':
          description: Invalid payload, invalid UUIDs, or member cap exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (5/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}:
    patch:
      tags:
        - Groups
      summary: Rename group conversation
      description: Updates the display name of a group conversation. Caller must be the group owner.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameGroupRequest'
      responses:
        '200':
          description: Group renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupConversationResponse'
        '400':
          description: Invalid name length, HTML characters, or invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Caller is not the group owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/members:
    get:
      tags:
        - Groups
      summary: List group members
      description: Returns members of the group conversation ordered by join timestamp.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Max members to return
        - in: query
          name: before
          schema:
            type: string
            format: date-time
          description: ISO timestamp cursor
      responses:
        '200':
          description: Group members list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberListResponse'
        '400':
          description: Invalid UUID or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Caller is not a member of this conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (60/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      tags:
        - Groups
      summary: Add members to group
      description: Adds one or more new members to a group. Caller must be the group owner.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembersRequest'
      responses:
        '200':
          description: Members added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMembersResponse'
        '400':
          description: Invalid payload, user already member, or group size limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Caller is not the group owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/members/{userId}:
    delete:
      tags:
        - Groups
      summary: Remove member or leave group
      description: Removes a member from the group (owner only) or allows a member to leave the group.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
          description: User UUID to remove
      responses:
        '204':
          description: Member removed or left successfully
        '400':
          description: Invalid UUID or user not in group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Non-owner attempting to remove another user, or caller not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (20/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/messages:
    get:
      tags:
        - Messages
      summary: List messages in conversation
      description: Returns messages in descending order with timeuuid pagination.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
          description: Page size
        - in: query
          name: before
          schema:
            type: string
            format: uuid
          description: Message timeuuid cursor
      responses:
        '200':
          description: Page of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Caller is not a member of this conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (300/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    post:
      tags:
        - Messages
      summary: Send a message to conversation
      description: Sends a new text message (1-4000 characters) and updates unread counts.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Empty message, message too long, or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (30/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/read:
    post:
      tags:
        - Receipts
      summary: Mark conversation messages as read
      description: Updates caller's read receipt up to messageId and clears unread count.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '204':
          description: Receipt updated and unread cleared
        '400':
          description: Message not in conversation or invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (120/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/messages/{messageId}:
    delete:
      tags:
        - Messages
      summary: Soft-delete a message
      description: Marks a message as deleted (only allowed for message sender).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
          description: Message timeuuid
      responses:
        '204':
          description: Message soft-deleted
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not a member or not message owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Message or conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags:
        - Messages
      summary: Edit a message
      description: Updates the body of a message (ownership check, not deleted, edit_count < 10).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation UUID
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
          description: Message timeuuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        '200':
          description: Message edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid payload, deleted message, or edit limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden (not member or not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Conversation or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limit exceeded (10/min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /conversations/{id}/messages/{messageId}/star:
    post:
      tags:
        - Messages
      summary: Star a message
      description: Stars a message for the authenticated user (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Message starred
        '401':
          description: Unauthorized
        '403':
          description: Not a member
        '404':
          description: Not found
    delete:
      tags:
        - Messages
      summary: Unstar a message
      description: Unstars a message for the authenticated user (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Message unstarred
        '401':
          description: Unauthorized

  /conversations/{id}/messages/{messageId}/reactions/{emoji}:
    put:
      tags:
        - Reactions
      summary: Add reaction to message
      description: Adds an emoji reaction to a message (idempotent).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: emoji
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated reaction summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionsResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Message or conversation not found
    delete:
      tags:
        - Reactions
      summary: Remove reaction from message
      description: Removes caller's emoji reaction from a message.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: emoji
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated reaction summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionsResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Message or conversation not found

  /conversations/{id}/messages/{messageId}/reactions:
    get:
      tags:
        - Reactions
      summary: List reactions for message
      description: Returns list of emoji reaction summaries with up to 50 userIds.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of reaction summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Message or conversation not found

  /starred:
    get:
      tags:
        - Messages
      summary: List starred messages
      description: Returns paginated starred messages for authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 30
        - in: query
          name: before
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of starred messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  hasMore:
                    type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by auth-service with audience "chat"

  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: invalid_payload
            message:
              type: string
              example: Invalid payload provided

    HealthResponse:
      type: object
      required:
        - status
        - scylla
        - redis
        - jwks
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        scylla:
          type: string
          enum: [ok, down]
          example: ok
        redis:
          type: string
          enum: [ok, down]
          example: ok
        jwks:
          type: string
          enum: [ok, stale]
          example: ok
        version:
          type: string
          example: 1.0.0

    StartConversationRequest:
      type: object
      required:
        - peerUserId
      properties:
        peerUserId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111

    Conversation:
      type: object
      required:
        - id
        - kind
        - createdAt
        - peerUserId
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: direct
        createdAt:
          type: string
          format: date-time
        peerUserId:
          type: string
          format: uuid

    ConversationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Conversation'

    CreateGroupRequest:
      type: object
      required:
        - name
        - memberIds
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Backend Team
        memberIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 99
          example:
            - 22222222-2222-4222-8222-222222222222
            - 33333333-3333-4333-8333-333333333333

    GroupConversation:
      type: object
      required:
        - id
        - kind
        - name
        - ownerId
        - memberIds
        - memberCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [group]
          example: group
        name:
          type: string
