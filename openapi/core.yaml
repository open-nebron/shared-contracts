openapi: 3.1.0
info:
  title: Nebron Core API
  description: Production-grade Core API service for Nebron microservice platform
  version: 1.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by auth-service with audience "core"
  schemas: {}
paths:
  /health:
    get:
      tags:
        - Health
      description: Liveness and dependency readiness check
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mongo:
                    type: string
                  redis:
                    type: string
                  jwks:
                    type: string
                required:
                  - status
                  - mongo
                  - redis
                  - jwks
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  mongo:
                    type: string
                  redis:
                    type: string
                  jwks:
                    type: string
  /internal/health:
    get:
      tags:
        - Health
      description: Internal debugging endpoint exposing JWKS cache status and age
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  jwks:
                    type: object
                    properties:
                      isLoaded:
                        type: boolean
                      ageSeconds:
                        type:
                          - number
                          - "null"
                      lastFetchedAt:
                        type:
                          - string
                          - "null"
                      keyCount:
                        type: number
                      jwksUrl:
                        type: string
                      lastError:
                        type:
                          - string
                          - "null"
  /internal/cleanup-orphans:
    post:
      tags:
        - Internal
      description: Trigger cleanup of unconfirmed orphaned media files older than 24 hours
      parameters:
        - schema:
            type: string
          in: header
          name: x-internal-token
          required: false
        - schema:
            type: string
          in: header
          name: authorization
          required: false
      responses:
        "200":
          description: Default Response
  /meta:
    get:
      tags:
        - Meta
      description: "Public metadata: supported languages, themes, and media upload limits"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                  themes:
                    type: array
                    items:
                      type: string
                  defaultLanguage:
                    type: string
                  limits:
                    type: object
                    properties:
                      avatarMaxBytes:
                        type: number
                      bannerMaxBytes:
                        type: number
                      bioMaxChars:
                        type: number
                      aboutMaxChars:
                        type: number
                      nameMaxChars:
                        type: number
                  acceptedImageTypes:
                    type: array
                    items:
                      type: string
  /me:
    get:
      tags:
        - Profile
      description: Get current user profile
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  username:
                    type: string
                  name:
                    type:
                      - string
                      - "null"
                  dateOfBirth:
                    type:
                      - string
                      - "null"
                  about:
                    type:
                      - string
                      - "null"
                  bio:
                    type:
                      - string
                      - "null"
                  language:
                    type: string
                  theme:
                    type: string
                  avatarUrl:
                    type:
                      - string
                      - "null"
                  bannerUrl:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                  updatedAt:
                    type:
                      - string
                      - "null"
                required:
                  - userId
                  - username
                  - language
                  - theme
                  - createdAt
    patch:
      tags:
        - Profile
      description: Update current user profile information and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                dateOfBirth:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                about:
                  type: string
                  maxLength: 2000
                bio:
                  type: string
                  maxLength: 300
                language:
                  type: string
                theme:
                  type: string
                  enum:
                    - light
                    - dark
                    - system
              additionalProperties: false
      responses:
        "200":
          description: Default Response
  /me/avatar/upload-url:
    post:
      tags:
        - Media
      description: Request a presigned POST slot for avatar upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentType
                - contentLength
              properties:
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                contentLength:
                  type: number
      responses:
        "200":
          description: Default Response
  /me/avatar/confirm:
    post:
      tags:
        - Media
      description: Confirm avatar upload and update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - objectKey
              properties:
                objectKey:
                  type: string
      responses:
        "200":
          description: Default Response
  /me/avatar:
    delete:
      tags:
        - Media
      description: Remove user avatar and delete file from storage
      responses:
        "200":
          description: Default Response
  /me/banner/upload-url:
    post:
      tags:
        - Media
      description: Request a presigned POST slot for banner upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentType
                - contentLength
              properties:
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                contentLength:
                  type: number
      responses:
        "200":
          description: Default Response
  /me/banner/confirm:
    post:
      tags:
        - Media
      description: Confirm banner upload and update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - objectKey
              properties:
                objectKey:
                  type: string
      responses:
        "200":
          description: Default Response
  /me/banner:
    delete:
      tags:
        - Media
      description: Remove user banner and delete file from storage
      responses:
        "200":
          description: Default Response
  /username/check:
    get:
      tags:
        - Profile
      description: Public check if a username is available
      parameters:
        - schema:
            type: string
          in: query
          name: username
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  reason:
                    type: string
                    enum:
                      - taken
                      - reserved
                      - invalid_format
                required:
                  - available
  /me/username:
    patch:
      tags:
        - Profile
      description: Claim or change username for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                required:
                  - username
  /relationships/check:
    get:
      tags:
        - Relationships
      description: Internal endpoint to batch-check block and mute state against multiple user IDs
      parameters:
        - name: userIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated target user IDs
        - name: fromUserId
          in: query
          required: false
          schema:
            type: string
          description: Optional requesting user ID
        - name: x-internal-token
          in: header
          required: true
          schema:
            type: string
          description: Internal service token matching INTERNAL_TOKEN env
      responses:
        "200":
          description: Relationship check result
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        blocked:
                          type: boolean
                        muted:
                          type: object
                          properties:
                            calls:
                              type: boolean
                            messages:
                              type: boolean
                          required:
                            - calls
                            - messages
                      required:
                        - blocked
                        - muted
                required:
                  - data
  /relationships/blocked:
    get:
      tags:
        - Relationships
      description: Returns the list of users blocked by the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of blocked users
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        blockedAt:
                          type: string
                          format: date-time
                        username:
                          type: string
                        name:
                          type: string
                          nullable: true
                        avatarUrl:
                          type: string
                          nullable: true
                      required:
                        - userId
                        - blockedAt
                        - username
                        - name
                        - avatarUrl
                required:
                  - blocked
  /relationships/{userId}:
    get:
      tags:
        - Relationships
      description: Returns the caller's relationship to the specified user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user ID
      responses:
        "200":
          description: Caller's relationship to target user
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
                  mute:
                    type: object
                    properties:
                      calls:
                        type: boolean
                      messages:
                        type: boolean
                      until:
                        type:
                          - string
                          - "null"
                    required:
                      - calls
                      - messages
                      - until
                required:
                  - blocked
                  - mute
  /relationships/{userId}/block:
    post:
      tags:
        - Relationships
      description: Block a user. Rejects self-block.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user ID to block
      responses:
        "204":
          description: User blocked successfully
    delete:
      tags:
        - Relationships
      description: Unblock a user.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user ID to unblock
      responses:
        "204":
          description: User unblocked successfully
  /relationships/{userId}/mute:
    post:
      tags:
        - Relationships
      description: Mute calls and/or messages from a user, optionally until a timestamp
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user ID to mute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calls:
                  type: boolean
                messages:
                  type: boolean
                until:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: Mute updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: boolean
                  messages:
                    type: boolean
                  until:
                    type:
                      - string
                      - "null"
                required:
                  - calls
                  - messages
                  - until
    delete:
      tags:
        - Relationships
      description: Unmute calls and messages from a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: Target user ID to unmute
      responses:
        "204":
          description: User unmuted successfully
servers:
  - url: /
    description: Current environment
tags:
  - name: Profile
    description: User profile management
  - name: Relationships
    description: Per-user-pair block and mute state management
  - name: Media
    description: Avatar and banner media uploads via Cloudflare R2
  - name: Meta
    description: Public metadata and configuration limits
  - name: Health
    description: System health and readiness checks
  - name: Internal
    description: Internal operations and maintenance
