name: CI/CD

on:
  push:
    branches: [ main, "feat/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build, Validate and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate types and compile TypeScript
        run: npm run build

      - name: Run unit & contract validation tests
        run: npm test

      - name: Verify package packability
        run: npm pack --dry-run

      - name: Consumer smoke test
        run: |
          mkdir -p /tmp/smoke-consumer
          cd /tmp/smoke-consumer
          npm init -y
          npm pkg set type=module
          npm install "$GITHUB_WORKSPACE"
          node -e '
            import { parseEvent } from "@nebron/contracts";
            const evt = parseEvent({
              type: "auth.user.registered",
              payload: {
                userId: "usr_smoke_test",
                email: "ci-smoke@nebron.io",
                createdAt: new Date().toISOString()
              }
            });
            if (evt.type !== "auth.user.registered") {
              throw new Error("Unexpected event type: " + evt.type);
            }
            console.log("CI/CD Consumer smoke test passed successfully!");
          '
